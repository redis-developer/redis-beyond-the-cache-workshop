          backend: registry.example.com/workshops/distributed-locks-backend@sha256:6666666666666666666666666666666666666666666666666666666666666666
          combined: registry.example.com/workshops/distributed-locks-runner@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        resourceClass: medium
