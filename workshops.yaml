version: 1
workshops:
  - id: 1_session_management
    title: Distributed Session Management
    description: >-
      Learn how to implement distributed session management using Redis and Spring Session.
      Experience the problem of in-memory sessions, then solve it with Redis-backed sessions
      that persist across application restarts and enable horizontal scaling.
    difficulty: Beginner
    estimatedMinutes: 30
    serviceName: session-management
    url: /workshop/session-management/
    dockerfile: java-springboot/1_session_management/Dockerfile
    frontendServiceName: session-management
    frontendDockerfile: java-springboot/1_session_management_frontend/Dockerfile
    backendServiceName: session-management-api
    backendDockerfile: java-springboot/1_session_management/Dockerfile
    infrastructureDependencies:
      - redis
    sessionScopedInfrastructureDependencies:
      - redis
    redisFlavor: standard
    frontendPrebuild: true
    topics:
      - Sessions
      - Spring Session
      - Distributed Systems
      - Scalability
    releases:
      - releaseId: session-management-2026.04.1
        releaseVersion: 2026.04.1
        mode: LAB
        defaultForWorkshop: true
        enabled: true
        environments:
          - local
          - cloud-run
        images:
          frontend: registry.example.com/workshops/session-management-frontend@sha256:1111111111111111111111111111111111111111111111111111111111111111
          backend: registry.example.com/workshops/session-management-backend@sha256:2222222222222222222222222222222222222222222222222222222222222222
          combined: registry.example.com/workshops/session-management-runner@sha256:9999999999999999999999999999999999999999999999999999999999999999
        resourceClass: small
        sessionTtlMinutes: 180
        mutableDependencies:
          - redis
