version: 1
workshops:
  - id: 1_session_management
    title: Distributed Session Management
    description: >-
      Learn how to implement distributed session management using Redis and Spring Session.
      Experience the problem of in-memory sessions, then solve it with Redis-backed sessions
      that persist across application restarts and enable horizontal scaling.
    difficulty: Beginner
    estimatedMinutes: 30
    serviceName: session-management
    url: /workshop/session-management/
    dockerfile: java-springboot/1_session_management/Dockerfile
    frontendServiceName: session-management
    frontendDockerfile: java-springboot/1_session_management_frontend/Dockerfile
    backendServiceName: session-management-api
    backendDockerfile: java-springboot/1_session_management/Dockerfile
    infrastructureDependencies:
      - redis
    sessionScopedInfrastructureDependencies:
      - redis
    redisFlavor: standard
    frontendPrebuild: true
    topics:
      - Sessions
      - Spring Session
      - Distributed Systems
      - Scalability
    releases:
      - releaseId: session-management-2026.04.1
        releaseVersion: 2026.04.1
        mode: LAB
        defaultForWorkshop: true
        enabled: true
        environments:
          - local
          - cloud-run
        images:
          frontend: registry.example.com/workshops/session-management-frontend@sha256:1111111111111111111111111111111111111111111111111111111111111111
          backend: registry.example.com/workshops/session-management-backend@sha256:2222222222222222222222222222222222222222222222222222222222222222
          combined: registry.example.com/workshops/session-management-runner@sha256:9999999999999999999999999999999999999999999999999999999999999999
        resourceClass: small
        sessionTtlMinutes: 180
        mutableDependencies:
          - redis
  - id: 2_full_text_search
    title: Full-Text Search with Redis
    description: >-
      Learn how to implement full-text search using Redis Query Engine and Redis OM Spring.
      Build a movie search application with text search, filtering, and sorting capabilities.
    difficulty: Beginner
    estimatedMinutes: 30
    serviceName: full-text-search
    url: /workshop/full-text-search/
    dockerfile: java-springboot/2_full_text_search/Dockerfile
    frontendServiceName: full-text-search
    frontendDockerfile: java-springboot/2_full_text_search_frontend/Dockerfile
    backendServiceName: full-text-search-api
    backendDockerfile: java-springboot/2_full_text_search/Dockerfile
    infrastructureDependencies:
      - redis
    sessionScopedInfrastructureDependencies:
      - redis
    redisFlavor: stack
    frontendPrebuild: true
    topics:
      - Query Engine
      - Full-Text Search
      - Redis OM
      - Secondary Index
    releases:
      - releaseId: full-text-search-2026.04.1
        releaseVersion: 2026.04.1
        mode: LAB
        defaultForWorkshop: true
        enabled: true
        environments:
          - local
          - cloud-run
        images:
          frontend: registry.example.com/workshops/full-text-search-frontend@sha256:3333333333333333333333333333333333333333333333333333333333333333
          backend: registry.example.com/workshops/full-text-search-backend@sha256:4444444444444444444444444444444444444444444444444444444444444444
          combined: registry.example.com/workshops/full-text-search-runner@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        resourceClass: small
        sessionTtlMinutes: 180
        mutableDependencies:
          - redis
  - id: 3_distributed_locks
    title: Distributed Locks
    description: >-
      Implement a Redis-backed distributed lock to protect Postgres inventory updates
      and prevent overselling under concurrent load.
    difficulty: Intermediate
    estimatedMinutes: 35
    serviceName: distributed-locks
    url: /workshop/distributed-locks/
    dockerfile: java-springboot/3_distributed_locks/Dockerfile
    frontendServiceName: distributed-locks
    frontendDockerfile: java-springboot/3_distributed_locks_frontend/Dockerfile
    backendServiceName: distributed-locks-api
    backendDockerfile: java-springboot/3_distributed_locks/Dockerfile
    infrastructureDependencies:
      - redis
      - postgres
    sessionScopedInfrastructureDependencies:
      - redis
      - postgres
    envOverrides:
      backend:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workshop
        SPRING_DATASOURCE_USERNAME: workshop
        SPRING_DATASOURCE_PASSWORD: workshop
    redisFlavor: standard
    frontendPrebuild: true
    topics:
      - Distributed Locks
      - Concurrency
      - Redis
      - Postgres
    releases:
      - releaseId: distributed-locks-2026.04.1
        releaseVersion: 2026.04.1
        mode: LAB
        defaultForWorkshop: true
        enabled: true
        environments:
          - local
          - cloud-run
        images:
          frontend: registry.example.com/workshops/distributed-locks-frontend@sha256:5555555555555555555555555555555555555555555555555555555555555555
          backend: registry.example.com/workshops/distributed-locks-backend@sha256:6666666666666666666666666666666666666666666666666666666666666666
          combined: registry.example.com/workshops/distributed-locks-runner@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        resourceClass: medium
        sessionTtlMinutes: 180
        mutableDependencies:
          - redis
          - postgres
  - id: 4_agent_memory
    title: Agent Memory Server
    description: >-
      Give your AI agents persistent memory with Redis-powered Agent Memory Server.
      Learn to use working memory for session context and long-term memory for
      persistent facts and preferences with semantic search capabilities.
    difficulty: Intermediate
    estimatedMinutes: 40
    serviceName: agent-memory
    url: /workshop/agent-memory/
    dockerfile: java-springboot/4_agent_memory/Dockerfile
    frontendServiceName: agent-memory
    frontendDockerfile: java-springboot/4_agent_memory_frontend/Dockerfile
    backendServiceName: agent-memory-api
    backendDockerfile: java-springboot/4_agent_memory/Dockerfile
    infrastructureDependencies:
      - redis
    sessionScopedInfrastructureDependencies:
      - redis
    sidecars:
      - serviceName: agent-memory-server
        image: redislabs/agent-memory-server:latest
        port: 8000
        env:
          REDIS_URL: redis://redis:6379
          PORT: "8000"
          GENERATION_MODEL: ${GENERATION_MODEL:-gpt-4o-mini}
          EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
          OPENAI_API_KEY: ${OPENAI_API_KEY:-}
          ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
          LONG_TERM_MEMORY: "True"
          ENABLE_TOPIC_EXTRACTION: "True"
          SUMMARIZATION_THRESHOLD: "0.7"
          DEDUPLICATION_DISTANCE_THRESHOLD: "0.35"
          ENABLE_NER: "True"
          DISABLE_AUTH: "true"
        dependsOn:
          - redis
        command:
          - agent-memory
          - api
          - --host
          - 0.0.0.0
          - --port
          - "8000"
          - --task-backend=asyncio
        healthcheck:
          test:
            - CMD
            - curl
            - -f
            - http://localhost:8000/v1/health
          interval: 10s
          timeout: 5s
          retries: 5
          startPeriod: 10s
    envOverrides:
      backend:
        AGENT_MEMORY_SERVER_URL: http://agent-memory-server:8000
    redisFlavor: stack
    frontendPrebuild: true
    topics:
      - AI Agents
      - Memory Management
      - Semantic Search
      - Vector Embeddings
    releases:
      - releaseId: agent-memory-2026.04.1
        releaseVersion: 2026.04.1
        mode: LAB
        defaultForWorkshop: true
        enabled: true
        environments:
          - local
          - cloud-run
        images:
          frontend: registry.example.com/workshops/agent-memory-frontend@sha256:7777777777777777777777777777777777777777777777777777777777777777
          backend: registry.example.com/workshops/agent-memory-backend@sha256:8888888888888888888888888888888888888888888888888888888888888888
          combined: registry.example.com/workshops/agent-memory-runner@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        resourceClass: medium
        sessionTtlMinutes: 180
        mutableDependencies:
          - redis
