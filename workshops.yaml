  - id: 3_distributed_locks
    title: Distributed Locks
    description: >-
      Implement a Redis-backed distributed lock to protect Postgres inventory updates
      and prevent overselling under concurrent load.
    difficulty: Intermediate
    estimatedMinutes: 35
    serviceName: distributed-locks
    url: /workshop/distributed-locks/
    dockerfile: java-springboot/3_distributed_locks/Dockerfile
    frontendServiceName: distributed-locks
    frontendDockerfile: java-springboot/3_distributed_locks_frontend/Dockerfile
    backendServiceName: distributed-locks-api
    backendDockerfile: java-springboot/3_distributed_locks/Dockerfile
    infrastructureDependencies:
      - redis
      - postgres
    sessionScopedInfrastructureDependencies:
      - redis
      - postgres
    envOverrides:
      backend:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workshop
        SPRING_DATASOURCE_USERNAME: workshop
        SPRING_DATASOURCE_PASSWORD: workshop
    redisFlavor: standard
    frontendPrebuild: true
    topics:
      - Distributed Locks
      - Concurrency
      - Redis
      - Postgres
    releases:
      - releaseId: distributed-locks-2026.04.1
        releaseVersion: 2026.04.1
        mode: LAB
        defaultForWorkshop: true
        enabled: true
        environments:
          - local
          - cloud-run
