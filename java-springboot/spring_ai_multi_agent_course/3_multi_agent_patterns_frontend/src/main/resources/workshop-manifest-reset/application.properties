spring.application.name=spring-ai-multi-agent-patterns
server.port=${SERVER_PORT:18086}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
agent-memory.server.url=${AGENT_MEMORY_SERVER_URL:http://localhost:8000}
agent-memory.server.namespace=${AGENT_MEMORY_SERVER_NAMESPACE:stock-analysis}
spring.ai.model.chat=openai
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.embedding=none
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.moderation.enabled=false
spring.ai.openai.embedding.enabled=false
stock-analysis.market-data.twelve-data.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
stock-analysis.market-data.twelve-data.api-key=${TWELVE_DATA_API_KEY:}
stock-analysis.sec.data-base-url=${SEC_DATA_BASE_URL:https://data.sec.gov}
stock-analysis.sec.ticker-file-url=${SEC_TICKER_FILE_URL:https://www.sec.gov/files/company_tickers.json}
stock-analysis.sec.user-agent=${SEC_USER_AGENT:redis-workshop@example.com}
stock-analysis.news.tavily.base-url=${TAVILY_BASE_URL:https://api.tavily.com}
stock-analysis.news.tavily.api-key=${TAVILY_API_KEY:}
stock-analysis.news.tavily.max-results=${TAVILY_MAX_RESULTS:3}
