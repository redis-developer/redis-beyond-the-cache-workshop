<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Building Multi Agents App</title>
  <style>
    :root {
      --bg: #0b1014;
      --panel: #121a20;
      --panel-2: #0f171d;
      --border: #2b3a46;
      --text: #eef5fb;
      --muted: #9fb0bf;
      --accent: #dc382c;
      --success: #4ade80;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 1rem;
      min-height: 100vh;
      padding: 1rem;
    }

    .topbar,
    .messages,
    .composer {
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--panel);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0.2rem 0 0;
      font-size: 1.25rem;
      line-height: 1.2;
    }

    .status {
      align-self: flex-start;
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 999px;
      color: var(--success);
      padding: 0.35rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .messages {
      min-height: 0;
      overflow: auto;
      padding: 1rem;
    }

    .message-list {
      display: grid;
      gap: 0.9rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .message {
      display: grid;
      gap: 0.45rem;
      max-width: 92%;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.85rem;
      background: var(--panel-2);
    }

    .message.user {
      justify-self: end;
      border-color: rgba(220, 56, 44, 0.45);
      background: rgba(220, 56, 44, 0.12);
    }

    .speaker {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .text {
      margin: 0;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .metric {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid rgba(71, 85, 105, 0.36);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.34);
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1;
      padding: 0.35rem 0.55rem;
    }

    .metric strong {
      color: var(--text);
    }

    .steps {
      display: grid;
      gap: 0.45rem;
      margin-top: 0.35rem;
    }

    .step {
      border-left: 3px solid rgba(220, 56, 44, 0.75);
      padding-left: 0.6rem;
      color: var(--muted);
      line-height: 1.4;
    }

    details {
      margin-top: 0.4rem;
      color: var(--muted);
    }

    summary {
      cursor: pointer;
      font-weight: 700;
    }

    pre {
      overflow: auto;
      max-height: 18rem;
      border: 1px solid var(--border);
      border-radius: 0.45rem;
      background: #071017;
      color: #dbeafe;
      padding: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      padding: 1rem;
    }

    input,
    textarea {
      width: 100%;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 0.45rem;
      background: #071017;
      color: var(--text);
      padding: 0.75rem;
      line-height: 1.45;
    }

    input {
      min-height: 3rem;
      resize: none;
      text-transform: uppercase;
    }

    textarea {
      min-height: 3rem;
      max-height: 10rem;
    }

    button {
      min-height: 3rem;
      border: 1px solid rgba(220, 56, 44, 0.55);
      border-radius: 0.45rem;
      background: rgba(220, 56, 44, 0.14);
      color: #fecaca;
      cursor: pointer;
      font-weight: 800;
      padding: 0.75rem 1rem;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    @media (max-width: 720px) {
      .topbar,
      .composer {
        grid-template-columns: 1fr;
        flex-direction: column;
      }

      .message {
        max-width: 100%;
      }

      .status {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Learner app</p>
        <h1>Building Multi Agents</h1>
      </div>
      <span id="status" class="status">Checking status</span>
    </header>

    <section class="messages" aria-label="Chat transcript">
      <ol id="messages" class="message-list"></ol>
    </section>

    <form id="composer" class="composer">
      <textarea id="message" rows="2" aria-label="Message" placeholder="Ask about a stock, for example: What is the current price for Duolingo?"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

  <script>
    const statusEl = document.querySelector('#status');
    const messagesEl = document.querySelector('#messages');
    const composerEl = document.querySelector('#composer');
    const messageEl = document.querySelector('#message');
    const sendButton = document.querySelector('#send');
    const conversationId = `multi-agents-${Date.now()}-${Math.random().toString(16).slice(2)}`;

    function appBaseUrl() {
      const href = window.location.href.endsWith('/app')
        ? `${window.location.href}/`
        : window.location.href;
      return new URL('.', href);
    }

    function apiUrl(path) {
      return new URL(`../api/multi-agents/${path}`, appBaseUrl()).toString();
    }

    function formatElapsedTime(elapsedMs) {
      if (!Number.isFinite(elapsedMs)) {
        return 'n/a';
      }

      if (elapsedMs < 1000) {
        return `${Math.max(1, Math.round(elapsedMs))} ms`;
      }

      return `${(elapsedMs / 1000).toFixed(1)} s`;
    }

    function tokenUsage(payload) {
      return [payload?.marketData, payload?.fundamentals, payload?.news, payload?.synthesis]
        .reduce((total, output) => {
          const value = Number(output?.tokenUsage?.totalTokens);
          return total + (Number.isFinite(value) ? value : 0);
        }, 0);
    }

    function formatTokenUsage(payload) {
      const totalTokens = tokenUsage(payload);
      return totalTokens > 0 ? totalTokens.toLocaleString() : 'n/a';
    }

    function addMetrics(item, payload, elapsedMs) {
      const metrics = document.createElement('div');
      metrics.className = 'metrics';

      [
        ['Time', formatElapsedTime(elapsedMs)],
        ['Tokens', formatTokenUsage(payload)]
      ].forEach(([label, value]) => {
        const metric = document.createElement('span');
        const name = document.createElement('span');
        const detail = document.createElement('strong');
        metric.className = 'metric';
        name.textContent = label;
        detail.textContent = value;
        metric.append(name, detail);
        metrics.append(metric);
      });

      item.append(metrics);
    }

    function addMessage(role, text, payload, elapsedMs) {
      const item = document.createElement('li');
      item.className = `message ${role}`;

      const speaker = document.createElement('div');
      speaker.className = 'speaker';
      speaker.textContent = role === 'user' ? 'You' : 'Assistant';

      const body = document.createElement('p');
      body.className = 'text';
      body.textContent = text;

      item.append(speaker, body);

      if (role === 'assistant' && payload) {
        addMetrics(item, payload, elapsedMs);
      }

      if (payload?.steps?.length) {
        const steps = document.createElement('div');
        steps.className = 'steps';
        payload.steps.forEach(step => {
          const stepEl = document.createElement('div');
          stepEl.className = 'step';
          stepEl.textContent = `${step.agent}: ${step.message}`;
          steps.append(stepEl);
        });
        item.append(steps);
      }

      if (payload?.analysis || payload?.marketData || payload?.fundamentals || payload?.news || payload?.synthesis) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const pre = document.createElement('pre');
        summary.textContent = 'Structured result';
        pre.textContent = JSON.stringify({
          marketData: payload.marketData,
          fundamentals: payload.fundamentals,
          news: payload.news,
          synthesis: payload.synthesis,
          analysis: payload.analysis
        }, null, 2);
        details.append(summary, pre);
        item.append(details);
      }

      messagesEl.append(item);
      item.scrollIntoView({ block: 'end' });
    }

    async function loadStatus() {
      const response = await fetch(apiUrl('status'), { credentials: 'include' });
      const payload = await response.json();
      statusEl.textContent = payload.status || 'ready';
      addMessage('assistant', 'Ask a stock question. The backend will route it through the coordinator, specialist agents, and synthesis agent available in this stage.');
    }

    async function sendMessage(event) {
      event.preventDefault();
      const message = messageEl.value.trim();
      if (!message) {
        return;
      }

      addMessage('user', message);
      messageEl.value = '';
      sendButton.disabled = true;
      sendButton.textContent = 'Sending';

      try {
        const startedAt = performance.now();
        const response = await fetch(apiUrl('run'), {
          method: 'POST',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ conversationId, task: message })
        });
        const payload = await response.json();
        addMessage('assistant', payload.answer || payload.error || 'No answer returned.', payload, performance.now() - startedAt);
      } catch (error) {
        addMessage('assistant', error.message || 'The request failed.');
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = 'Send';
      }
    }

    composerEl.addEventListener('submit', sendMessage);
    messageEl.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        composerEl.requestSubmit();
      }
    });
    loadStatus();
  </script>
</body>
</html>
