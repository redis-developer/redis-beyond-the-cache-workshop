schemaVersion: 1
viewId: "5"
route: /5
pageType: narrative
title: "STAGE 5: Final Stock Helper"
slot: instructions
summary: Combine prompt, structure, tools, and memory into one small stock helper.
navigation:
  previousLabel: Memory and advisors
  nextLabel: Open editor checklist
sections:
  - sectionId: final-helper
    title: Exercise Goal
    blocks:
      - type: markdown
        body: |
          Finish with one helper method that combines the pieces you have already enabled.

          The final helper will use:

          - `ChatClient` for the prompt
          - structured output for the typed result
          - `MarketDataTools` for the stock snapshot
          - Redis memory for the conversation
          - advisors for memory and structured output behavior

          This stage assumes the previous Stage 1 through Stage 4 edits are already enabled.
      - type: codeSnippet
        language: java
        title: Target Result Shape
        caption: The UI displays these typed fields instead of parsing prose.
        code: |
          record StockHelperResult(
                  String ticker,
                  String question,
                  String answer,
                  String action,
                  String reasoning,
                  String riskLevel
          ) {
          }
      - type: codeSnippet
        language: java
        title: Target Helper Shape
        caption: One call combines memory, tools, and structured output.
        code: |
          StockHelperResult result = memoryChatClient.prompt()
                  .system("Use the stock_snapshot tool first, then return the structured helper result.")
                  .user("Ticker: " + ticker + "\nQuestion: " + question)
                  .tools(marketDataTools)
                  .advisors(spec -> spec.param(ChatMemory.CONVERSATION_ID, conversationId))
                  .advisors(AdvisorParams.ENABLE_NATIVE_STRUCTURED_OUTPUT)
                  .call()
                  .entity(StockHelperResult.class);
      - type: callout
        tone: info
        title: What To Notice
        body: |
          This is still a small helper, not a full multi-agent system. The important part is the shape: one stable Java method coordinates prompt, tool access, typed output, and conversation context.
  - sectionId: code-edits
    title: Enable Final Helper
    blocks:
      - type: editorStepList
        listId: final-helper-service
        title: "`SpringAiDemoService.java`"
        startAt: 1
        progressGroup: stage-5
        items:
          - itemId: open-service
            body: Open `SpringAiDemoService.java`. The Stage 5 final helper block is already present near `helper(...)`.
            action:
              id: openFile
              label: Open Service
              args:
                file: SpringAiDemoService.java
                line: 14
          - itemId: enable-uuid-import
            body: Uncomment the Stage 5 import for `UUID`. The helper uses it only when a request does not provide a conversation id.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 5.enableUuidImport
          - itemId: enable-helper-block
            body: In `helper(...)`, comment out the scaffold `NOT_IMPLEMENTED` return. Then uncomment the Stage 5 final helper block.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 5.enableHelperBlock
      - type: callout
        tone: info
        title: Checkpoint
        body: The helper should not manually call the tool. Give the tool to `ChatClient` and let the model decide when it needs the snapshot.
  - sectionId: run
    title: Run It
    blocks:
      - type: editorStepList
        listId: run-final-helper
        title: Recompile And Test
        startAt: 4
        progressGroup: stage-5
        items:
          - itemId: recompile
            body: Click `Recompile App` so the backend restarts with the final helper enabled.
          - itemId: open-app
            body: Return to the learner app. Stage 5 sends requests to the final helper endpoint.
          - itemId: ask-stock
            body: Keep `fundamentals-demo` as the conversation id and send `What should I notice about NVDA right now?`
          - itemId: ask-follow-up
            body: With the same conversation id, send `For that same stock, what risk level did you choose?`
          - itemId: verify-helper
            body: |
              The response should show typed result fields, `toolInvoked: true`, a stock snapshot, and no error.
