sections:
  - sectionId: spring-ai
    title: What Is Spring AI?
    blocks:
      - type: markdown
        body: |
          Spring AI gives Spring apps one API for AI models.

          In this module, the stock helper uses that API to send prompts, return typed results, call Java tools, and keep short conversation context.
  - sectionId: chat-apis
    title: ChatModel And ChatClient
    blocks:
      - type: markdown
        body: |
          `ChatModel` is the provider connection. Spring Boot wires the implementation for OpenAI, Gemini, Anthropic, Azure OpenAI, or another configured provider.

          The value is a common interface. Your service code can stay mostly the same while configuration chooses the provider and model.

          `ChatClient` sits on top of `ChatModel`. It is the fluent API you use for system messages, user messages, tools, advisors, and structured output.
      - type: codeSnippet
        language: java
        title: Smallest Useful Chat Call
        caption: Stage 1 starts from this shape.
        code: |
          String answer = chatClient.prompt()
              .user("Explain what changed for MSFT in three bullets.")
              .call()
              .content();
  - sectionId: structured-output
    title: Structured Output
    blocks:
      - type: markdown
        body: |
          Natural language is easy for people to read. Code works better with predictable JSON fields and a stable schema.

          Structured output asks the model for data Spring AI can bind into a Java type, such as a record. In this lab, the stock helper returns separate fields for finish reason, ticker, resolved question, and reasoning.
      - type: codeSnippet
        language: java
        title: Typed Result Shape
        caption: A small type gives the UI and the next step stable fields.
        code: |
          record StockDecision(
              String finishReason,
              String resolvedTicker,
              String resolvedQuestion,
              String reasoning
          ) {
          }
  - sectionId: tools-agents
    title: Tools And Agents
    blocks:
      - type: markdown
        body: |
          A tool is Java code the model is allowed to call. In Spring AI, a tool is commonly a method annotated with `@Tool`.

          Use tools when the model needs application data or application behavior. The model chooses when to ask. Your Java method still owns the real work.
      - type: codeSnippet
        language: java
        title: Tool Boundary
        caption: The model can ask for the tool, but the Java method owns the data.
        code: |
          @Tool(name = "stock_snapshot", description = "Return a stock snapshot for a ticker symbol.")
          StockSnapshot stockSnapshot(String ticker) {
              return snapshotFor(ticker);
          }
      - type: callout
        tone: info
        body: |
          An agent repeats a simple loop: receive a task, choose a tool if needed, observe the result, then answer or stop.
  - sectionId: memory-advisors
    title: Memory And Advisors
    blocks:
      - type: markdown
        body: |
          LLMs are stateless. They only know what your app sends in the current request.

          `ChatMemoryRepository` stores messages. `ChatMemory` chooses how much history to include.

          A memory advisor connects that memory to `ChatClient`. At runtime, a conversation id tells Spring AI which history to load.
      - type: markdown
        body: |
          Advisors are helpers around `ChatClient` requests and responses.

          They can add memory, inject context, influence structured output, or inspect traffic. Tools help the model act. Advisors help the client behave.
  - sectionId: baseline-chat
    title: Baseline Chat
    blocks:
      - type: markdown
        body: |
          The learner app starts as a chat scaffold.

          Send any stock question. The UI sends the message to the backend, but the backend returns the same fixed response every time.

          That is intentional. Stage 1 replaces the hardcoded response with the first real `ChatClient` call.
