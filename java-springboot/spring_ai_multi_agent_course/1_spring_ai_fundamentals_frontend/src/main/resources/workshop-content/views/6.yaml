schemaVersion: 1
viewId: "6"
route: /6
pageType: editor
title: "Spring AI Fundamentals Editor"
slot: instructions
summary: Complete the Spring AI stock helper exercises in the learner files.
navigation:
  previousLabel: Final helper
sections:
  - sectionId: overview
    blocks:
      - type: callout
        tone: info
        body: Work through the files in order. Keep each change small, recompile often, and verify each step in the UI before adding the next capability.
  - sectionId: setup
    title: "Step 1: Configure Spring AI"
    blocks:
      - type: editorStepList
        listId: configure-spring-ai
        title: Build And Properties
        startAt: 1
        progressGroup: setup
        items:
          - itemId: open-build
            body: Open `build.gradle.kts` and inspect the Spring AI starter dependencies used by this lab.
            action:
              id: openFile
              label: Open Build File
              args:
                file: build.gradle.kts
          - itemId: open-properties
            body: Open `application.properties` and inspect the model settings used by the local runtime.
            hint: Do not commit local secrets.
            action:
              id: openFile
              label: Open Properties
              args:
                file: application.properties
  - sectionId: client
    title: "Step 2: Build The First Chat Call"
    blocks:
      - type: editorStepList
        listId: first-chat-call
        title: ChatModel And ChatClient
        startAt: 3
        progressGroup: client
        items:
          - itemId: open-config
            body: Open `SpringAiDemoService.java` and inspect how `ChatClient` is created around `ChatModel`.
            action:
              id: openFile
              label: Open Service
              args:
                file: SpringAiDemoService.java
          - itemId: open-service
            body: Open `SpringAiDemoService.java` and change the first stock prompt so it asks for a concise explanation.
            action:
              id: openFile
              label: Open Service
              args:
                file: SpringAiDemoService.java
          - itemId: recompile-first
            body: Recompile the app, open the Prompt panel, run the request, and observe how your prompt change affects the answer.
            action:
              id: recompileApp
              label: Recompile App
  - sectionId: structured
    title: "Step 3: Add Structure"
    blocks:
      - type: editorStepList
        listId: structured-call
        title: Typed Stock Snapshot
        startAt: 6
        progressGroup: structured
        items:
          - itemId: add-record
            body: Inspect the `StockDecision` record and note which fields the UI can display.
            action:
              id: openFile
              label: Open Service
              args:
                file: SpringAiDemoService.java
          - itemId: use-entity
            body: Adjust one structured prompt, recompile, open the Structured output panel, and verify that the typed fields change.
            hint: Keep the prompt explicit about the fields you need.
  - sectionId: tools-memory
    title: "Step 4: Add Tools And Memory"
    blocks:
      - type: editorStepList
        listId: tools-and-memory
        title: Market Data And Follow Ups
        startAt: 8
        progressGroup: tools-memory
        items:
          - itemId: open-market-tools
            body: Open `MarketDataTools.java` and change one synthetic market snapshot.
            action:
              id: openFile
              label: Open Tools
              args:
                file: MarketDataTools.java
          - itemId: use-tool
            body: Find where the market data tool is attached to the stock analysis prompt, then run the Tools panel and observe the snapshot returned.
            action:
              id: openFile
              label: Open Service
              args:
                file: SpringAiDemoService.java
          - itemId: add-advisor
            body: Find the memory advisor and conversation id parameter, then use the same conversation id for two related stock questions in the Memory and advisors panel.
            action:
              id: openFile
              label: Open Service
              args:
                file: SpringAiDemoService.java
          - itemId: recompile-final
            body: Recompile, open the Final helper panel, and test one stock question plus one follow up with the same conversation id.
            action:
              id: recompileApp
              label: Recompile App
