schemaVersion: 1
viewId: "1"
route: /1
pageType: narrative
title: "STAGE 1: ChatModel, ChatClient, And The Minimum Prompt"
slot: instructions
summary: Replace the scaffold response with the first real model call.
navigation:
  previousLabel: Intro and setup
  nextLabel: Add structured output
sections:
  - sectionId: goal
    title: Exercise Goal
    blocks:
      - type: markdown
        body: |
          The chat UI already sends a message to the backend. Right now the backend returns a scaffold response.

          In this stage, wire the first Spring AI path so the response comes from OpenAI.

          `ChatModel` is provided by Spring Boot from the configured provider. `ChatClient` wraps that model with the fluent API your service code uses.
  - sectionId: configure
    title: Configure The Model
    blocks:
      - type: editorStepList
        listId: configure-model
        title: Session Environment
        startAt: 1
        progressGroup: stage-1
        items:
          - itemId: configure-openai-key
            body: If `OPENAI_API_KEY` is not already available in the session, use `Env` next to `Logs`, add the variable, save it, and let the app restart.
            hint: The key is a session setting. Do not put it in source code.
            action:
              id: openRoute
              label: Open Learner App
              args:
                route: /1?tool=learner-app
  - sectionId: code-edits
    title: Enable The Chat Call
    blocks:
      - type: editorStepList
        listId: minimum-prompt
        title: "`SpringAiDemoService.java`"
        startAt: 2
        progressGroup: stage-1
        items:
          - itemId: open-service
            body: Open `SpringAiDemoService.java`. All Stage 1 code is already present and marked with `Stage 1` comments.
            action:
              id: openFile
              label: Open Service
              args:
                file: SpringAiDemoService.java
                line: 6
          - itemId: enable-imports
            body: Uncomment the Stage 1 imports for `ChatClient` and `ChatModel`.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 1.enableImports
          - itemId: enable-fields
            body: Uncomment the Stage 1 fields for `chatModel` and `chatClient`.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 1.enableFields
          - itemId: enable-constructor
            body: Uncomment the Stage 1 `ChatModel chatModel` constructor parameter and the `this.chatModel = chatModel;` assignment.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 1.enableConstructor
          - itemId: replace-placeholder
            body: In `prompt(...)`, comment out the hardcoded `PLACEHOLDER_ANSWER` return. Then uncomment the Stage 1 prompt block.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 1.enablePrompt
          - itemId: enable-client-helper
            body: Uncomment the Stage 1 `client()` helper method. It plugs the injected `ChatModel` into `ChatClient.builder(chatModel).build()`.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 1.enableClientHelper
      - type: codeSnippet
        language: java
        title: Target Prompt Shape
        caption: Keep this first call plain so you can see raw generated text.
        code: |
          String answer = client().prompt()
              .system("You are a concise stock analysis assistant.")
              .user(nonBlank(request.message(), "Explain what Spring AI ChatClient does."))
              .call()
              .content();
  - sectionId: run
    title: Run It
    blocks:
      - type: editorStepList
        listId: run-chat
        title: Recompile And Test
        startAt: 7
        progressGroup: stage-1
        items:
          - itemId: recompile
            body: Click `Recompile App` so the backend restarts with your edits.
            action:
              id: recompileApp
              label: Recompile App
          - itemId: ask-question
            body: Return to the learner app and send a stock question, such as `Explain MSFT for a beginner in three short bullets.`
            action:
              id: openRoute
              label: Return To App
              args:
                route: /1?tool=learner-app
          - itemId: verify-response
            body: The answer should no longer say `Spring AI is not wired yet`. It should be generated text from the model.
            action:
              id: openRoute
              label: Return To App
              args:
                route: /1?tool=learner-app
      - type: callout
        tone: warning
        title: Checkpoint
        body: If the app fails to start or the response reports a model error, check `OPENAI_API_KEY` in `Env`, save it, and recompile again.
