      - type: editorStepList
        listId: memory-service-wiring
        title: "`SpringAiDemoService.java`"
        startAt: 4
        progressGroup: stage-4
        items:
          - itemId: open-service
            body: Open `SpringAiDemoService.java`. The Stage 4 service wiring, advisor call, and message count helper are already present.
            action:
