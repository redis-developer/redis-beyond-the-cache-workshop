            body: Open `SpringAiFundamentalsAiConfig.java`. The Stage 4 Redis memory configuration is already present and marked with `Stage 4` comments.
            action:
              id: openFile
              label: Open Config
              args:
                file: SpringAiFundamentalsAiConfig.java
                line: 4
          - itemId: enable-config-imports
            body: Uncomment the Stage 4 imports for `ChatMemory`, `ChatMemoryRepository`, `MessageWindowChatMemory`, `RedisChatMemoryRepository`, `Value`, `Bean`, and `JedisPooled`.
            action:
              id: applyEditorStep
