schemaVersion: 1
viewId: "4"
route: /4
pageType: narrative
title: "STAGE 4: Memory And Advisors"
slot: instructions
summary: Store chat history in Redis and load it through an advisor.
navigation:
  previousLabel: Tools
  nextLabel: Final helper
sections:
  - sectionId: goal
    title: Exercise Goal
    blocks:
      - type: markdown
        body: |
          Stage 3 gave the model a Java tool.

          In this stage, give the chat flow short conversation memory. LLMs are stateless by default, so your application has to store previous messages and decide which ones go back into the prompt.

          This workshop uses Spring AI's official Redis `ChatMemoryRepository`. The local workshop runs on `redis:latest`, so Redis 8 provides JSON and Query Engine support. The repository stores messages in Redis. `MessageWindowChatMemory` keeps the prompt window small. `MessageChatMemoryAdvisor` attaches that memory to `ChatClient`.

          The code also uses a small `RedisSafeChatMemory` helper so Redis stores conversation messages without provider response metadata. The memory concepts stay the same: repository for storage, memory for the window, advisor for loading history into the request.
      - type: codeSnippet
        language: java
        title: Target Redis Repository Shape
        caption: Redis stores the chat messages. The repository is the persistence layer.
        code: |
          @Bean
          public ChatMemoryRepository chatMemoryRepository(JedisPooled jedisPooled) {
              return RedisChatMemoryRepository.builder()
                      .jedisClient(jedisPooled)
                      .keyPrefix("spring-ai-fundamentals:")
                      .maxMessagesPerConversation(12)
                      .build();
          }
      - type: codeSnippet
        language: java
        title: Target Advisor Shape
        caption: The conversation id tells the advisor which history to load.
        code: |
          String answer = memoryChatClient.prompt()
                  .user("What stock am I reviewing?")
                  .advisors(spec -> spec.param(ChatMemory.CONVERSATION_ID, conversationId))
                  .call()
                  .content();
  - sectionId: code-edits
    title: Enable Memory
    blocks:
