          - itemId: enable-memory-imports
            body: Uncomment the Stage 4 imports for `MessageChatMemoryAdvisor`, `ChatMemory`, and `ChatMemoryRepository`.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 4.enableMemoryImports
          - itemId: enable-memory-dependency
            body: Uncomment the `ChatMemoryRepository` and `memoryChatClient` fields, then uncomment the `ChatMemory` and `ChatMemoryRepository` constructor parameters and assignments.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 4.enableMemoryDependency
          - itemId: enable-memory-block
            body: In `memory(...)`, comment out the scaffold `NOT_IMPLEMENTED` return. Then uncomment the Stage 4 memory block.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 4.enableMemoryBlock
          - itemId: enable-memory-helper
            body: Uncomment the Stage 4 `messageCount(...)` helper.
            action:
              id: applyEditorStep
              label: Apply Change
              args:
                stepId: 4.enableMessageCountHelper
      - type: callout
        tone: info
        title: Checkpoint
        body: The model still receives one request at a time. Memory works because the advisor loads earlier messages for the same conversation id.
  - sectionId: run
    title: Run It
    blocks:
      - type: editorStepList
        listId: run-memory
        title: Recompile And Test
        startAt: 9
        progressGroup: stage-4
        items:
          - itemId: recompile
            body: Click `Recompile App` so the backend restarts with Redis memory enabled.
          - itemId: open-app
            body: Return to the learner app. Stage 4 sends chat messages to the memory endpoint and shows the conversation id.
          - itemId: remember-stock
            body: Keep `fundamentals-demo` as the conversation id and send `Remember that I am reviewing NVDA.`
          - itemId: ask-follow-up
            body: With the same conversation id, send `What stock am I reviewing?`
          - itemId: verify-memory
            body: The assistant response should use the earlier message, and `messageCount` should increase as the conversation continues.
