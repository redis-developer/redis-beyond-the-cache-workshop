# Application name
spring.application.name=distributed-locks

# Server configuration
server.port=${SERVER_PORT:18082}

# Postgres configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:workshop}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:workshop}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:workshop}}
spring.datasource.hikari.maximum-pool-size=5

# Redis configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
spring.redis.host=${SPRING_REDIS_HOST:${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}}
spring.redis.port=${SPRING_REDIS_PORT:${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}}

# SQL init
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Workshop behavior
workshop.lock.mode=none
workshop.lock.wait=200ms
workshop.lock.lease=5s
workshop.purchase.delay-ms=200
workshop.cache.ttl=5s

# Logging
logging.level.com.redis.workshop.locks=INFO
