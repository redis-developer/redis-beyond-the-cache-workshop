# Application name
spring.application.name=agent-memory-frontend

# Server configuration
server.port=${SERVER_PORT:8083}

# Backend workshop API target
workshop.frontend.session-backend-url=${WORKSHOP_SESSION_BACKEND_URL:${WORKSHOP_BACKEND_URL:}}
workshop.frontend.workspace-path=${WORKSHOP_SESSION_WORKSPACE_PATH:${WORKSHOP_SOURCE_PATH:${WORKSHOP_BASE_PATH:}}}
workshop.backend.url=${WORKSHOP_BACKEND_URL:}
workshop.source.path=${WORKSHOP_SOURCE_PATH:${WORKSHOP_BASE_PATH:}}

# Logging
logging.level.com.redis.workshop.memory=INFO
