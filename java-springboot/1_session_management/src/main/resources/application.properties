# Application name
spring.application.name=session-management

# Server configuration
server.port=${SERVER_PORT:18080}

# Redis configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

# Session configuration
# TODO: Change 'none' to 'redis' to enable Redis session storage
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.redis.flush-mode=immediate
spring.session.redis.repository-type=default

# Session timeout (30 minutes)
server.servlet.session.timeout=30m

# Logging
logging.level.org.springframework.session=DEBUG
